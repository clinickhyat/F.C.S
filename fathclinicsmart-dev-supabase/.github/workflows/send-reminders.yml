name: إرسال تذكيرات المواعيد

on:
  schedule:
    # كل ساعة عند الدقيقة 0
    - cron: '0 * * * *'
  # يسمح بتشغيل العملية يدوياً من تبويب Actions
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: استدعاء دالة Supabase لإرسال التذكيرات
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}' \
            https://ebuumyqofptnjjaujlyd.supabase.co/functions/v1/send-reminders
